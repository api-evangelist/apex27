actions:
  openapiHarvested: false
  specsSaved: 0
  openapiDirectoryCreated: false
  reason: |
    No machine-readable contract of any kind is published by Apex27 — no OpenAPI, no
    Swagger, no Postman collection, no AsyncAPI, and no OData $metadata. The endpoint
    map recovered from the vendor's npm packages was deliberately NOT turned into a
    synthesised OpenAPI during bootstrap; only genuinely fetched artifacts belong in
    openapi/. Any derivation is left to the enrichment pipeline, where it will be
    labelled as AE-derived rather than provider-published.
  apisYmlUpdated: true
