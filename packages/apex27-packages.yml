note: Apex27 ships no conventional server-side SDK in any language. The only vendor-published client code
  is a pair of n8n community nodes on npm, both published by the npm user "james_apex27". They are first-party
  (they carry the Apex27 name, icon and credential definitions) and they are the de-facto client library
  for both Apex27 APIs — the CRM node in particular contains the complete request map this repo derived
  its OpenAPI from.
