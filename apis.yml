name: Apex27
kind: company
description: Apex27 Limited is a United Kingdom estate agency CRM vendor, founded in 2019 and
  headquartered in the UK, selling cloud software to sales, lettings and commercial agents for
  £35 per user per month. It sits in the middle of the UK residential value chain — between
  the agent and the portals — capturing leads, applicants, listings, viewings, valuations, offers,
  sales progression and tenancies, then syndicating listings out to Rightmove, Zoopla, OnTheMarket
  and others. Because the UK has no MLS and no cooperative listing database, that CRM seat is
  the only practical route a listing takes to market, and Apex27 is one of the private gatekeepers
  of it. Apex27 does operate two real HTTP APIs — the Apex27 CRM API at api.apex27.co.uk and
  a per-tenant Portal API that powers agency websites — but neither has a public developer portal.
  The documentation URL that Apex27's own published n8n node points at, docs.apex27.co.uk, returns
  404, and every CRM endpoint returns 401 Unauthorised without a key issued inside a paid tenant.
  Access is customer-only, not self-serve. RESO does not apply — no RESO Web API or Data Dictionary
  certification exists for Apex27 or for the UK market at all, since RESO is a NAR/MLS construct
  with no UK counterpart. Apex27 publishes no open data; the UK's open property layer belongs
  to HM Land Registry and Ordnance Survey, not to the CRM vendors.
