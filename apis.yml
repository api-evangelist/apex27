apis:
- aid: apex27:apex27-crm-api
  name: Apex27 CRM API
  description: The Apex27 CRM API is the vendor's REST interface over the estate agency CRM,
    covering contacts, leads, listings and their media, rooms, keys, notes, offers, viewings,
    valuations, inspections, issues and onboarding checks, plus branches, users, tasks, documents,
    tenancies, completions, call logs, notifications, saved listing searches, search regions,
    global search, client portal sign-in links and webhook subscriptions. It authenticates with
    an `x-api-key` request header and paginates with `page` and `pageSize` (25-250). The host
    is live — every probed collection returned HTTP 401 Unauthorised — but there is no public
    reference documentation; the documentation URL declared in Apex27's own published n8n credential
    (https://docs.apex27.co.uk) returned HTTP 404 on 2026-07-26. Keys are issued to paying customers
    inside the CRM admin panel, so this is a customer-only surface, not a self-serve developer
    API.
  humanURL: https://apex27.co.uk/integration/n8n
  baseURL: https://api.apex27.co.uk
