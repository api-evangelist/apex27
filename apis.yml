- aid: apex27:apex27-portal-api
  name: Apex27 Portal API
  description: The Apex27 Portal API is the per-tenant, website-facing API that drives search
    and enquiry on Apex27-built agency websites. Its documented operations are get-listings,
    get-listing, get-search-options, get-statistics, contact, request-valuation, add-favourite
    and remove-favourite, spanning sales, lettings and land inventory with sort and filter options.
    It has no shared host — the base URL is the agency's own portal domain with /api appended
    (the vendor's published credential uses the placeholder https://portal-abcd1234.apex27.co.uk/api)
    — and it authenticates with an `api_key` query-string parameter issued under Admin Panel
    > Websites > [Your Website] > Integrations. No public documentation page for it was found.
  humanURL: https://apex27.co.uk/websites
